<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Hitamkan</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#0f0f0f;
            color:white;
            font-family:Arial,sans-serif;

            display:flex;
            justify-content:center;
            align-items:center;

            min-height:100vh;

            padding:20px;
        }

        .container{
            width:100%;
            max-width:430px;

            background:#181818;

            padding:25px;

            border-radius:22px;

            box-shadow:
            0 0 30px rgba(0,0,0,0.5);

            text-align:center;
        }

        h1{
            font-size:36px;
            margin-bottom:10px;
        }

        p{
            opacity:0.7;
            margin-bottom:25px;
        }

        input[type="file"]{
            width:100%;

            background:#222;

            color:white;

            padding:12px;

            border:none;

            border-radius:12px;

            margin-bottom:20px;
        }

        button{
            width:100%;

            padding:15px;

            border:none;

            border-radius:14px;

            background:linear-gradient(
                135deg,
                #111,
                #333
            );

            color:white;

            font-size:18px;
            font-weight:bold;

            cursor:pointer;

            transition:0.3s;
        }

        button:hover{
            transform:scale(1.02);

            background:linear-gradient(
                135deg,
                #222,
                #444
            );
        }

        .previewBox,
        .resultBox{
            margin-top:25px;
        }

        img{
            width:100%;

            border-radius:18px;

            display:none;
        }

        .show{
            display:block !important;
        }

    </style>
</head>
<body>

<div class="container">

    <h1>AI Hitamkan</h1>

    <p>
        Upload gambar lalu tekan tombol Hitamkan
    </p>

    <input
        type="file"
        id="imageInput"
        accept="image/*"
    >

    <button id="hitamkanBtn">
        Hitamkan
    </button>

    <div class="previewBox">
        <img id="previewImg">
    </div>

    <div class="resultBox">
        <img id="resultImg">
    </div>

</div>

<script>

const imageInput =
document.getElementById("imageInput");

const previewImg =
document.getElementById("previewImg");

const resultImg =
document.getElementById("resultImg");

const hitamkanBtn =
document.getElementById("hitamkanBtn");

let selectedFile;

imageInput.addEventListener(
"change",
(e)=>{

    selectedFile =
    e.target.files[0];

    if(!selectedFile) return;

    previewImg.src =
    URL.createObjectURL(selectedFile);

    previewImg.classList.add("show");
});

hitamkanBtn.addEventListener(
"click",
async ()=>{

    if(!selectedFile){

        alert(
        "Upload gambar dulu"
        );

        return;
    }

    const img =
    new Image();

    img.src =
    URL.createObjectURL(selectedFile);

    img.onload = ()=>{

        const canvas =
        document.createElement("canvas");

        const ctx =
        canvas.getContext("2d");

        canvas.width =
        img.width;

        canvas.height =
        img.height;

        ctx.drawImage(
            img,
            0,
            0
        );

        const imageData =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );

        const data =
        imageData.data;

        // skin mask canvas
        const maskCanvas =
        document.createElement("canvas");

        maskCanvas.width =
        canvas.width;

        maskCanvas.height =
        canvas.height;

        const maskCtx =
        maskCanvas.getContext("2d");

        const maskData =
        maskCtx.createImageData(
            canvas.width,
            canvas.height
        );

        // detect skin
        for(
            let i = 0;
            i < data.length;
            i += 4
        ){

            const r = data[i];
            const g = data[i+1];
            const b = data[i+2];

            const max =
            Math.max(r,g,b);

            const min =
            Math.min(r,g,b);

            const diff =
            max - min;

            const avg =
            (r+g+b)/3;

            const isSkin = (

                r > 40 &&
                g > 20 &&
                b > 15 &&

                r >= g &&
                r >= b &&

                diff > 10 &&
                diff < 120 &&

                avg > 45
            );

            const alpha =
            isSkin ? 255 : 0;

            maskData.data[i] = 255;
            maskData.data[i+1] = 255;
            maskData.data[i+2] = 255;
            maskData.data[i+3] = alpha;
        }

        maskCtx.putImageData(
            maskData,
            0,
            0
        );

        // feather smooth
        maskCtx.filter =
        "blur(8px)";

        maskCtx.drawImage(
            maskCanvas,
            0,
            0
        );

        // apply dark brown overlay
        const finalCanvas =
        document.createElement("canvas");

        finalCanvas.width =
        canvas.width;

        finalCanvas.height =
        canvas.height;

        const finalCtx =
        finalCanvas.getContext("2d");

        // original
        finalCtx.drawImage(
            canvas,
            0,
            0
        );

        // overlay dark brown
        finalCtx.globalCompositeOperation =
        "source-atop";

        finalCtx.drawImage(
            maskCanvas,
            0,
            0
        );

        finalCtx.fillStyle =
        "rgba(92,58,38,0.45)";

        finalCtx.fillRect(
            0,
            0,
            finalCanvas.width,
            finalCanvas.height
        );

        finalCtx.globalCompositeOperation =
        "source-over";

        resultImg.src =
        finalCanvas.toDataURL(
            "image/png"
        );

        resultImg.classList.add(
            "show"
        );
    };
});

                </script>

</body>
</html>
