<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waifu Skin Tone Editor (Accurate)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- LOAD SEMUA LIBRARY YANG DIBUTUHKAN -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    
    <!-- Untuk Segmentasi Tubuh Detail -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-segmentation"></script>
    
    <!-- Untuk Deteksi Wajah Detail -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-5">

    <div class="max-w-md w-full bg-gray-800 p-6 rounded-2xl shadow-xl text-center">
        <h1 class="text-2xl font-bold mb-4 text-pink-400">Accurate Waifu Tannery</h1>
        
        <!-- Upload Area -->
        <input type="file" id="upload" accept="image/*" class="hidden">
        <label for="upload" class="cursor-pointer bg-pink-600 hover:bg-pink-700 px-4 py-2 rounded-lg font-medium inline-block mb-4">
            Pilih Gambar Waifu
        </label>

        <!-- Preview Kontainer -->
        <div class="relative w-full min-h-[250px] bg-gray-700 rounded-xl overflow-hidden flex items-center justify-center mb-4">
            <canvas id="outputCanvas" class="max-w-full h-auto rounded-xl"></canvas>
            <!-- Loading Indicator -->
            <div id="loadingStatus" class="absolute inset-0 bg-gray-900/80 flex items-center justify-center hidden">
                <span class="text-lg">Memuat AI...</span>
            </div>
        </div>

        <!-- Kontrol Kegelapan -->
        <div class="mb-4">
            <label class="block text-sm font-medium mb-1">Tingkat Kegelapan Kulit</label>
            <input type="range" id="darkness" min="0" max="100" value="0" class="w-full accent-pink-500">
        </div>

        <button id="downloadBtn" class="w-full bg-green-600 hover:bg-green-700 py-2 rounded-lg font-semibold hidden">
            Download Hasil
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
