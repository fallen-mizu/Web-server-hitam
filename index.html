<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hitamkan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>AI Hitamkan</h1>

    <p>
        Upload gambar lalu tekan tombol Hitamkan
    </p>

    <input type="file" id="imageInput" accept="image/*">

    <button id="hitamkanBtn">
        Hitamkan
    </button>

    <div class="previewBox">
        <img id="previewImg">
    </div>

    <div class="resultBox">
        <img id="resultImg">
    </div>

</div>

<link rel="stylesheet" href="style.css">
<script src="app.js"></script>
</body>
</html>
